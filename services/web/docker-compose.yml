
volumes:
  data:
  template-gallery:

services:

  web:
    build:
      context: ../..
      dockerfile: services/web/Dockerfile
      target: base
    image: overleaf/web:local
    volumes:
      - .:/overleaf/services/web
      - ../../node_modules:/overleaf/node_modules
      - ../../libraries:/overleaf/libraries
      - ../../bin/shared/wait_for_it:/overleaf/bin/shared/wait_for_it
      - ./app/template-gallery:/overleaf/services/web/app/template-gallery
    ports:
      - "3000:3000"
    working_dir: /overleaf/services/web
    environment:
      - NODE_ENV=development  # ✅ کلید اصلی
      - SESSION_SECRET=test-secret-key-123
      - WEB_API_USER=overleaf
      - WEB_API_PASSWORD=testpassword123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_URL=mongodb://mongo:27017/sharelatex
      - PUBLIC_URL=http://localhost:3000
      - TEMPLATE_FOLDER=/overleaf/services/web/app/template-gallery
    depends_on:
      - redis
      - mongo
    command: npm start
    user: node

  webpack:
    build:
      context: ../..
      dockerfile: services/web/Dockerfile
      target: base
    volumes:
      - .:/overleaf/services/web
      - ../../node_modules:/overleaf/node_modules
      - ../../libraries:/overleaf/libraries
    ports:
      - "3808:3808"
    working_dir: /overleaf/services/web
    environment:
      - NODE_ENV=development
    command: npm run webpack -- --watch
    user: node

  test_unit:
    image: node:22.15.1
    volumes:
      - .:/overleaf/services/web
      - ../../node_modules:/overleaf/node_modules
      - ../../libraries:/overleaf/libraries
      - ../../bin/shared/wait_for_it:/overleaf/bin/shared/wait_for_it
      - ./app/template-gallery:/overleaf/services/web/app/template-gallery 
    working_dir: /overleaf/services/web
    env_file: docker-compose.common.env
    environment:
      BASE_CONFIG:
      OVERLEAF_CONFIG:
      MOCHA_GREP: ${MOCHA_GREP}
      LOG_LEVEL: ${LOG_LEVEL:-}
      NODE_ENV: test
      NODE_OPTIONS: "--unhandled-rejections=strict"
    entrypoint: /overleaf/bin/shared/wait_for_it mongo:27017 --timeout=0 --
    command: npm run --silent test:unit:app
    user: node
    depends_on:
      - mongo

  test_acceptance:
    image: node:22.15.1
    volumes:
      - .:/overleaf/services/web
      - ../../node_modules:/overleaf/node_modules
      - ../../libraries:/overleaf/libraries
      - ../../bin/shared/wait_for_it:/overleaf/bin/shared/wait_for_it
      - ./app/template-gallery:/overleaf/services/web/app/template-gallery 
    user: node
    working_dir: /overleaf/services/web
    env_file: docker-compose.common.env
    environment:
      BASE_CONFIG:
      OVERLEAF_CONFIG:
      MOCHA_GREP: ${MOCHA_GREP}
      LOG_LEVEL: ${LOG_LEVEL:-}
      MONGO_SERVER_SELECTION_TIMEOUT: 600000
      MONGO_SOCKET_TIMEOUT: 300000
      # OVERLEAF_ALLOW_ANONYMOUS_READ_AND_WRITE_SHARING: 'true'

    extra_hosts:
      - 'www.overleaf.test:127.0.0.1'
    depends_on:
      - redis
      - mongo
      - saml
      - ldap
    entrypoint: /overleaf/bin/shared/wait_for_it mongo:27017 --timeout=0 --
    command: npm run --silent test:acceptance:app

  test_frontend:
    build:
      context: ../..
      dockerfile: services/web/Dockerfile
      target: base
    volumes:
      - .:/overleaf/services/web
      - ../../node_modules:/overleaf/node_modules
      - ../../libraries:/overleaf/libraries
      - ./app/template-gallery:/overleaf/services/web/app/template-gallery 
    working_dir: /overleaf/services/web
    environment:
      MOCHA_GREP: ${MOCHA_GREP}
      NODE_OPTIONS: "--unhandled-rejections=strict"
      VERBOSE_LOGGING:
    command: npm run --silent test:frontend
    user: node

  test_frontend_ct:
    image: cypress/included:13.13.2
    volumes:
      - ../../:/overleaf
    working_dir: /overleaf/services/web
    environment:
      VERBOSE_LOGGING:
      CYPRESS_SPEC_PATTERN: ${CYPRESS_SPEC_PATTERN:-}
      CYPRESS_EXCLUDE_SPEC_PATTERN: ${CYPRESS_EXCLUDE_SPEC_PATTERN:-}
    entrypoint: npm
    command:
      - "run"
      - "cypress:run-ct"

  redis:
    image: redis:7.4.3

  mongo:
    image: mongo:7.0.20
    command: --replSet overleaf
    volumes:
      - ../../bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      # Required when using the automatic database setup for initializing the
      # replica set. This override is not needed when running the setup after
      # starting up mongo.
      - mongo:127.0.0.1

  ldap:
    image: rroemhild/test-openldap:1.1
    # Workaround large memory allocation (using the max-open-files-limit as socket buffer scale).
    # REF: https://github.com/moby/moby/issues/8231#issuecomment-63877553
    # REF: https://github.com/moby/moby/issues/8231#issuecomment-63871343
    command:
      - 'bash'
      - '-c'
      - 'ulimit -n 1024 && exec bash /run.sh'

  saml:
      image: us-east1-docker.pkg.dev/overleaf-ops/ol-docker/saml-test
      environment:
          SAML_BASE_URL_PATH: 'http://saml/simplesaml/'
          SAML_TEST_SP_ENTITY_ID: 'overleaf-test-saml'
          SAML_TEST_SP_LOCATION: 'http://www.overleaf.test:23000/saml/callback'

